[package]
name = "panna"
description = "Offline, memory-safe PDF viewer and editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "panna"
path = "src/main.rs"

[dependencies]
panna-core = { path = "../panna-core", version = "0.1.0" }
iced = { version = "0.14", default-features = false, features = ["wgpu", "tiny-skia", "crisp", "image-without-codecs", "thread-pool", "linux-theme-detection", "x11", "wayland", "web-colors"] }
rfd = "0.17"
futures-channel = "0.3"

[lints]
workspace = true
