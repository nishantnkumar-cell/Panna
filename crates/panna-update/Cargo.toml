[package]
name = "panna-update"
description = "Panna's only network code: asks GitHub Releases for a newer version, when the user clicks Check for updates"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# HTTPS through rustls (ring, Mozilla's root certificates). No OpenSSL, no async runtime.
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"

[lints]
workspace = true
