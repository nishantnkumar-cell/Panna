[package]
name = "panna-core"
description = "Document loading and rendering for the PDF viewer (no GUI dependencies)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
panna-sandbox = { path = "../panna-sandbox", version = "0.1.0" }
aes = "0.9"
getrandom = { version = "0.4", features = ["sys_rng"] }
# Without the default "simd" feature: its image scaling uses hand-written SIMD (unsafe) on
# picture data from the PDF. Safe scaling costs about 25 ms per full-page photo.
hayro = { version = "0.9", default-features = false, features = ["embed-fonts", "embed-cmaps"] }
# Image stamps: the PNG and JPEG decoders and the compressor hayro already brings in.
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }
zune-core = "0.5"
zune-jpeg = "0.5"
md-5 = "0.11"
# Reading XFDF form data files (already used by the SVG icons).
roxmltree = "0.21"
sha2 = "0.11"
# Checking digital signatures: CMS and certificates, and the ECDSA algorithms.
cms = "0.3.0-rc.2"
der = "0.8"
x509-cert = { version = "0.3", default-features = false }
spki = "0.8"
# RSA signatures are checked with public-key arithmetic only (no private keys involved).
num-bigint = "0.5"
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "std", "pkcs8"] }
p384 = { version = "0.14", default-features = false, features = ["ecdsa", "std", "pkcs8"] }
# Signing: certificates and keys from PKCS #12 (.p12, .pfx) files, and RSA's private-key
# operation (blinded with random numbers).
p12-keystore = "0.4"
rsa = { version = "0.10", default-features = false, features = ["std", "encoding", "pkcs1v15"] }
sha1 = "0.11"
# Passwords and file keys are wiped from memory when dropped.
zeroize = { version = "1", features = ["serde"] }
# Requests and replies between the app and its locked-down document process (see isolate).
serde = { version = "1", features = ["derive", "rc"] }
postcard = { version = "1", default-features = false, features = ["use-std"] }
# Recognising text in scanned pages (OCR), offline, with the models in models/.
ocrs = { version = "0.14", default-features = false, features = ["rten"] }
rten = { version = "0.28", default-features = false, features = ["rten_format"] }

[lints]
workspace = true
