[package]
name = "panna-core"
description = "Document loading and rendering for the PDF viewer (no GUI dependencies)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
aes = "0.8"
getrandom = "0.3"
hayro = "0.8"
# Image stamps: the PNG and JPEG decoders and the compressor hayro already brings in.
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
zune-core = "0.5"
zune-jpeg = "0.5"
md-5 = "0.10"
sha2 = "0.10"

[lints]
workspace = true
