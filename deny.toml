# Supply-chain policy, checked in CI with `cargo deny check`.

[graph]
all-features = false

[advisories]
# Fail on any RustSec vulnerability or unsound-code advisory; warn on unmaintained crates.
version = 2
yanked = "deny"
unmaintained = "workspace"
ignore = [
    # The Marvin timing attack needs someone timing many private-key operations from outside.
    # Panna only signs, on the user's own machine, with the rsa crate's blinding on, and no
    # fixed version of the crate exists yet.
    { id = "RUSTSEC-2023-0071", reason = "local signing only, blinded; no fixed release" },
    # Timing variability in crypto-bigint 0.5, used by p256/p384 to verify signatures (public
    # data) and to sign on the user's own machine. The fix is only in 0.7, which the 0.13
    # elliptic-curve crates can't use; revisit when p256/p384 move to it.
    { id = "RUSTSEC-2026-0387", reason = "local ECDSA signing and public-key verifying only; fix needs crypto-bigint 0.7" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "0BSD",
    "Unlicense",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
# The app is offline by design: no HTTP, TLS or network client crates may enter the tree.
deny = [
    { name = "reqwest" },
    { name = "hyper" },
    { name = "h2" },
    { name = "ureq" },
    { name = "curl" },
    { name = "curl-sys" },
    { name = "isahc" },
    { name = "attohttpc" },
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "native-tls" },
    { name = "rustls" },
    { name = "tungstenite" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
