# Supply-chain policy, checked in CI with `cargo deny check`.

[graph]
all-features = false

[advisories]
# Fail on any RustSec vulnerability or unsound-code advisory; warn on unmaintained crates.
version = 2
yanked = "deny"
unmaintained = "workspace"
# Nothing is ignored. (RUSTSEC-2023-0071 in rsa and RUSTSEC-2026-0387 in crypto-bigint,
# both timing issues, are fixed by rsa 0.10 and the 0.14 elliptic-curve crates.)
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "0BSD",
    "Unlicense",
    # webpki-roots: Mozilla's root certificates, used only by Check for updates.
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
# The app is offline by design: no HTTP, TLS or network client crates may enter the tree.
# The one exception is panna-update, which makes a single HTTPS request when the user clicks
# Check for updates: ureq may be used only by panna-update, and rustls only by ureq.
deny = [
    { name = "reqwest" },
    { name = "hyper" },
    { name = "h2" },
    { name = "ureq", wrappers = ["panna-update"] },
    { name = "curl" },
    { name = "curl-sys" },
    { name = "isahc" },
    { name = "attohttpc" },
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "native-tls" },
    { name = "rustls", wrappers = ["ureq"] },
    { name = "tungstenite" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
