name: CI

on:
  push:
    branches: [main]
    # A version tag (v1.2.3) also publishes a draft release with checksums.
    tags: ["v*"]
  pull_request:
  schedule:
    # Nightly: re-check advisories against new RustSec entries and run the fuzzer longer.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: Lint and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked

  supply-chain:
    name: Advisories, licenses and banned crates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories bans licenses sources

  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [open_render, analyse, import_data]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Seed the corpus
        working-directory: fuzz
        env:
          TARGET: ${{ matrix.target }}
          REAL_WORLD: ${{ github.event_name != 'pull_request' && github.event_name != 'push' }}
        run: |
          mkdir -p "corpus/$TARGET"
          if [ "$TARGET" = import_data ]; then
            cp seeds/data/* "corpus/$TARGET/"
            exit 0
          fi
          cp seeds/pdf/* ../crates/panna-core/tests/fixtures/*.pdf "corpus/$TARGET/"
          find ../crates/panna-core/tests/fuzz-regressions -type f ! -name '*.md' -exec cp {} "corpus/$TARGET/" \;
          # Nightly, also the pdf.js test suite's PDFs under 1 MB: only read as input, never run.
          if [ "$REAL_WORLD" = true ]; then
            git clone --quiet --depth 1 --filter=blob:none --no-checkout https://github.com/mozilla/pdf.js /tmp/pdfjs || exit 0
            git -C /tmp/pdfjs ls-tree -r -l HEAD test/pdfs | awk '$4 < 1048576 && $5 ~ /\.pdf$/ { print $5 }' > /tmp/small.txt
            git -C /tmp/pdfjs checkout HEAD --pathspec-from-file=/tmp/small.txt || exit 0
            xargs -a /tmp/small.txt -I{} cp "/tmp/pdfjs/{}" "corpus/$TARGET/"
          fi
          ls "corpus/$TARGET" | wc -l
      - name: Run fuzzer
        working-directory: fuzz
        env:
          RUSTFLAGS: ""
        run: |
          SECONDS_TO_RUN=${{ github.event_name == 'schedule' && 3600 || 300 }}
          cargo +nightly fuzz run ${{ matrix.target }} corpus/${{ matrix.target }} -- -max_total_time=$SECONDS_TO_RUN -rss_limit_mb=2048
      - name: Upload crash inputs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts

  build:
    name: Release build (${{ matrix.name }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: windows-aarch64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
          - name: macos-universal
            os: macos-latest
            target: universal
    runs-on: ${{ matrix.os }}
    env:
      # Signing runs only once these secrets exist (see docs/RELEASING.md), and never for pull
      # requests from forks, which don't get secrets.
      WINDOWS_SIGNING: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
      MACOS_SIGNING: ${{ secrets.MACOS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target == 'universal' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}

      - name: Build (Linux, Windows)
        if: matrix.target != 'universal'
        run: cargo build --release --locked -p panna --target ${{ matrix.target }}

      - name: Package Linux tarball
        if: runner.os == 'Linux'
        run: |
          ID=io.github.nishantnkumar_cell.Panna
          D=panna-${{ matrix.name }}
          mkdir -p $D/share/applications $D/share/metainfo $D/share/icons/hicolor/scalable/apps $D/bin
          cp target/${{ matrix.target }}/release/panna $D/bin/
          cp packaging/linux/$ID.desktop $D/share/applications/
          cp packaging/linux/$ID.metainfo.xml $D/share/metainfo/
          cp packaging/linux/$ID.svg $D/share/icons/hicolor/scalable/apps/
          tar czf $D.tar.gz $D

      - name: Sign Windows executable
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING == 'true'
        shell: pwsh
        env:
          CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERTIFICATE))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com `
            /f $pfx /p $env:PASSWORD /d Panna target/${{ matrix.target }}/release/panna.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $signtool.FullName verify /pa target/${{ matrix.target }}/release/panna.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item $pfx

      - name: Package Windows zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory panna-${{ matrix.name }}
          Copy-Item target/${{ matrix.target }}/release/panna.exe panna-${{ matrix.name }}/
          Compress-Archive panna-${{ matrix.name }} panna-${{ matrix.name }}.zip

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $arch = if ('${{ matrix.target }}'.StartsWith('aarch64')) { 'arm64' } else { 'x64compatible' }
          $exe = Join-Path $PWD 'target/${{ matrix.target }}/release/panna.exe'
          & $iscc "/DAppVersion=$version" "/DArch=$arch" "/DExe=$exe" "/DName=${{ matrix.name }}" "/O$PWD" packaging/windows/panna.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and bundle macOS app (Apple Silicon + Intel)
        if: matrix.target == 'universal'
        run: |
          cargo build --release --locked -p panna --target aarch64-apple-darwin
          cargo build --release --locked -p panna --target x86_64-apple-darwin
          APP="Panna.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          lipo -create -output "$APP/Contents/MacOS/panna" \
            target/aarch64-apple-darwin/release/panna \
            target/x86_64-apple-darwin/release/panna
          cp packaging/macos/Info.plist "$APP/Contents/Info.plist"
          cp packaging/macos/Panna.icns "$APP/Contents/Resources/Panna.icns"

      - name: Sign macOS app (ad hoc)
        if: matrix.target == 'universal' && env.MACOS_SIGNING != 'true'
        # Enough for Apple Silicon to run it; Gatekeeper still warns on first open.
        run: codesign --force --sign - Panna.app

      - name: Sign and notarise macOS app
        if: matrix.target == 'universal' && env.MACOS_SIGNING == 'true'
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/signing.p12"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F'"' '/Developer ID Application/ { print $2; exit }')
          test -n "$IDENTITY"
          # Hardened runtime, needed for notarisation; Panna needs none of its exceptions.
          codesign --force --options runtime --timestamp --sign "$IDENTITY" Panna.app
          codesign --verify --strict --verbose=2 Panna.app
          ditto -c -k --keepParent Panna.app notarise.zip
          xcrun notarytool submit notarise.zip --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple Panna.app
          spctl --assess --type execute --verbose Panna.app
          rm notarise.zip
          security delete-keychain "$KEYCHAIN"

      - name: Zip macOS app
        if: matrix.target == 'universal'
        run: ditto -c -k --keepParent Panna.app panna-${{ matrix.name }}.zip

      - name: Make macOS disk image
        if: matrix.target == 'universal'
        run: |
          mkdir dmg
          cp -R Panna.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname Panna -srcfolder dmg -ov -format UDZO panna-${{ matrix.name }}.dmg

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: panna-${{ matrix.name }}
          path: |
            panna-${{ matrix.name }}.tar.gz
            panna-${{ matrix.name }}.zip
            panna-${{ matrix.name }}-setup.exe
            panna-${{ matrix.name }}.dmg
          if-no-files-found: error

  release:
    name: Draft release with checksums
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, flatpak]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft \
            --title "Panna $GITHUB_REF_NAME" --notes "Check a download with \`sha256sum -c SHA256SUMS --ignore-missing\`."

  flatpak:
    name: Flatpak (KDE Plasma and GNOME)
    needs: check
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Vendor crate sources for the offline Flatpak build
        run: |
          pip3 install --break-system-packages aiohttp==3.14.5 tomlkit==0.15.2
          curl -sSfLO https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/74697c75b630d7330e77250fc13cb5ea688d9479/cargo/flatpak-cargo-generator.py
          echo "0a2db6be87d75910facef28ab46d4d6460802e8419ab850d0caa6a364d26b380  flatpak-cargo-generator.py" | sha256sum -c -
          python3 flatpak-cargo-generator.py Cargo.lock -o packaging/linux/cargo-sources.json
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6
        with:
          bundle: panna.flatpak
          manifest-path: packaging/linux/io.github.nishantnkumar_cell.Panna.yml
          cache-key: flatpak-builder-${{ github.sha }}
