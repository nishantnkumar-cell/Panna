name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly: re-check advisories against new RustSec entries and run the fuzzer longer.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: Lint and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked

  supply-chain:
    name: Advisories, licenses and banned crates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories bans licenses sources

  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [open_render, analyse, import_data]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Run fuzzer
        working-directory: fuzz
        env:
          RUSTFLAGS: ""
        run: |
          SECONDS_TO_RUN=${{ github.event_name == 'schedule' && 3600 || 300 }}
          cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=$SECONDS_TO_RUN -rss_limit_mb=2048
      - name: Upload crash inputs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts

  build:
    name: Release build (${{ matrix.name }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: windows-aarch64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
          - name: macos-universal
            os: macos-latest
            target: universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target == 'universal' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}

      - name: Build (Linux, Windows)
        if: matrix.target != 'universal'
        run: cargo build --release --locked -p panna --target ${{ matrix.target }}

      - name: Package Linux tarball
        if: runner.os == 'Linux'
        run: |
          ID=io.github.nishantnkumar_cell.Panna
          D=panna-${{ matrix.name }}
          mkdir -p $D/share/applications $D/share/metainfo $D/share/icons/hicolor/scalable/apps $D/bin
          cp target/${{ matrix.target }}/release/panna $D/bin/
          cp packaging/linux/$ID.desktop $D/share/applications/
          cp packaging/linux/$ID.metainfo.xml $D/share/metainfo/
          cp packaging/linux/$ID.svg $D/share/icons/hicolor/scalable/apps/
          tar czf $D.tar.gz $D

      - name: Package Windows zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory panna-${{ matrix.name }}
          Copy-Item target/${{ matrix.target }}/release/panna.exe panna-${{ matrix.name }}/
          Compress-Archive panna-${{ matrix.name }} panna-${{ matrix.name }}.zip

      - name: Build and bundle macOS app (Apple Silicon + Intel)
        if: matrix.target == 'universal'
        run: |
          cargo build --release --locked -p panna --target aarch64-apple-darwin
          cargo build --release --locked -p panna --target x86_64-apple-darwin
          APP="Panna.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          lipo -create -output "$APP/Contents/MacOS/panna" \
            target/aarch64-apple-darwin/release/panna \
            target/x86_64-apple-darwin/release/panna
          cp packaging/macos/Info.plist "$APP/Contents/Info.plist"
          cp packaging/macos/Panna.icns "$APP/Contents/Resources/Panna.icns"
          # Ad-hoc signature so Apple Silicon will run it. Notarisation needs a developer account.
          codesign --force --deep --sign - "$APP"
          ditto -c -k --keepParent "$APP" panna-${{ matrix.name }}.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: panna-${{ matrix.name }}
          path: |
            panna-${{ matrix.name }}.tar.gz
            panna-${{ matrix.name }}.zip
          if-no-files-found: error

  flatpak:
    name: Flatpak (KDE Plasma and GNOME)
    needs: check
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Vendor crate sources for the offline Flatpak build
        run: |
          pip3 install --break-system-packages aiohttp==3.14.5 tomlkit==0.15.2
          curl -sSfLO https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/74697c75b630d7330e77250fc13cb5ea688d9479/cargo/flatpak-cargo-generator.py
          echo "0a2db6be87d75910facef28ab46d4d6460802e8419ab850d0caa6a364d26b380  flatpak-cargo-generator.py" | sha256sum -c -
          python3 flatpak-cargo-generator.py Cargo.lock -o packaging/linux/cargo-sources.json
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6
        with:
          bundle: panna.flatpak
          manifest-path: packaging/linux/io.github.nishantnkumar_cell.Panna.yml
          cache-key: flatpak-builder-${{ github.sha }}
